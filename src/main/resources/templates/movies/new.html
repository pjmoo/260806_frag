<!doctype html>
<html lang="ko">
<!--<head th:replace="fragments/head :: head('영화 추가', '영화를 추가합시다')">-->
<head th:replace="fragments/head :: head(${movieId == null ? '영화 추가' : '영화 수정'}, ${movieId == null ? '영화 추가합시다' : '영화 수정합시다'})">
    <!--  여기 들어가는 건 자리 표시  -->
</head>
<body>
<nav th:replace="fragments/nav :: nav(${movieId == null ? 'new' : 'edit'})"></nav>
<section>
    <!--    th:action="@{/movies/new}" -->
    <form
            th:method="post"
            th:action="@{${movieId == null ? '/movies/new' : '/movies/' + movieId + '/edit'}}"
            th:object="${movie}"
    >
        <label>제목 : <input th:field="*{title}"></label><br>
        <!--        <div th:if="${#fields.hasErrors('title')}">-->
        <!--            <p th:text="${#fields.errors('title')}"></p>-->
        <!--        </div>-->
        <div th:replace="fragments/errorMsg :: errorMsg('title')"></div>
        <label>가격 : <input th:field="*{price}" type="number"></label><br>
        <div th:replace="fragments/errorMsg :: errorMsg('price')"></div>
        <!--        <button>등록</button>-->
        <button th:text="${movieId == null ? '등록' : '수정'}"></button>
        <a th:if="${movieId != null}" th:href="@{/movies/{id}(id=${id})}">돌아가기</a>
    </form>
</section>
</body>
</html>
